name: Auto package bump

on:
  schedule:
    - cron: '30 20,12,4 * * *'
  workflow_dispatch:

concurrency:
  group: auto-bump
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify opencode API key
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set -euo pipefail
          [ -n "${OPENCODE_API_KEY:-}" ] \
            || { echo "::error::OPENCODE_API_KEY not set"; exit 1; }

      - name: Detect latest opencode version
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER=$(gh api repos/anomalyco/opencode/releases/latest --jq '.tag_name' | tr -d v)
          [ -n "$VER" ] || { echo "::error::version detect failed"; exit 1; }
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "latest opencode stable: $VER"

      - name: Get date
        id: date
        run: echo "date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # multi-package skip check: run the agent only when at least one
      # package has a newer upstream release than its latest ebuild
      - name: Skip if ebuilds for latest versions already exist
        id: needed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # pkg <tab> suffix <tab> upstream version
          #   suffix: "_p1" for wrapped prebuilt packages, "" otherwise
          upstream() {
            case "${1##*/}" in
              opencode-bin)      bash dev-util/opencode-bin/files/detect-version.sh stable
                                 bash dev-util/opencode-bin/files/detect-version.sh beta | sed 's/^0\.0\.0-beta-/0.0.0_beta/' ;;
              zcode-bin)         bash dev-util/zcode-bin/files/detect-version.sh ;;
              codex-bin)         bash dev-util/codex-bin/files/detect-version.sh ;;
              maa-cli)           bash games-util/maa-cli/files/detect-version.sh ;;
              claude-code-bin)   bash dev-util/claude-code-bin/files/detect-version.sh ;;
              curl-impersonate)  gh api repos/lexiforest/curl-impersonate/releases/latest --jq '.tag_name' | sed -e 's/^v//' -e 's/-rc/_rc/' ;;
              curl-cffi)         gh api repos/lexiforest/curl_cffi/releases/latest --jq '.tag_name' | sed -e 's/^v//' -e 's/b\([0-9][0-9]*\)$/_beta\1/' -e 's/rc\([0-9][0-9]*\)$/_rc\1/' ;;
            esac
          }
          outdated=0
          while IFS=$'\t' read -r pkg suffix; do
            ver=$(upstream "$pkg")
            if [ -z "$ver" ]; then
              echo "::warning::$pkg: version detect failed; assuming outdated"
              outdated=1
              continue
            fi
            while IFS= read -r v; do
              if ! git ls-files -- "$pkg/*.ebuild" | grep -qx "$pkg/${pkg##*/}-${v}${suffix}.ebuild"; then
                echo "outdated: $pkg (upstream $v)"
                outdated=1
              fi
            done <<<"$ver"
          done <<'TABLE'
          dev-util/opencode-bin	_p1
          dev-util/zcode-bin	_p1
          dev-util/codex-bin	_p1
          games-util/maa-cli	_p1
          dev-util/claude-code-bin	_p1
          net-misc/curl-impersonate
          dev-python/curl-cffi
          TABLE
          if [ "$outdated" -eq 0 ]; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache opencode binary
        if: steps.needed.outputs.up_to_date != 'true'
        id: cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/opencode/opencode
          key: opencode-bin-${{ steps.ver.outputs.version }}

      - name: Install opencode from cache
        if: steps.needed.outputs.up_to_date != 'true' && steps.cache.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          test -x ~/.cache/opencode/opencode || { echo "::error::cache contains no usable binary"; exit 1; }
          sudo install ~/.cache/opencode/opencode /usr/local/bin/
          opencode --version

      - name: Install opencode from release
        if: steps.needed.outputs.up_to_date != 'true' && steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/.cache/opencode
          curl -sSL --fail --retry 3 --connect-timeout 30 \
            "https://github.com/anomalyco/opencode/releases/download/v${{ steps.ver.outputs.version }}/opencode-linux-x64.tar.gz" \
            | tar xz -C ~/.cache/opencode/
          test -x ~/.cache/opencode/opencode || { echo "::error::tarball produced no binary"; exit 1; }
          sudo install ~/.cache/opencode/opencode /usr/local/bin/
          opencode --version

      - name: Configure git identity
        if: steps.needed.outputs.up_to_date != 'true'
        run: |
          git config user.name lax-bot
          git config user.email lax@users.noreply.github.com

      - name: Bump packages
        id: bump
        if: steps.needed.outputs.up_to_date != 'true'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set -o pipefail; set +e
          # pin the model: newer CLI defaults route to opencode-go Go-tier
          # models that need a subscription this key does not have
          timeout 900 opencode --print-logs run -m opencode/big-pickle 'bump version for all the packages per AGENTS.md; do NOT commit or push; do NOT touch any Manifest file and do NOT run gen-manifest.sh or pkgdev — CI regenerates all Manifests after your changes' 2>&1 | tee bump.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "::error::opencode agent failed (rc=$rc); see bump.log"
            exit 1
          fi

      - name: Upload agent log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bump-log-${{ steps.date.outputs.date }}
          path: bump.log
          if-no-files-found: ignore
          retention-days: 7

      # no pkgdev on the runner: regenerate DIST entries for changed prebuilt
      # ebuilds by downloading the artifacts and hashing them directly
      - name: Regenerate Manifest for prebuilt packages
        if: steps.needed.outputs.up_to_date != 'true'
        run: bash .github/scripts/gen-manifest.sh

      - name: Sanity-check changes
        if: steps.needed.outputs.up_to_date != 'true'
        run: |
          set -euo pipefail
          git add -A
          all=$(git diff --cached --name-only --diff-filter=AM | grep -E '\.ebuild$' || true)
          if [ -z "$all" ]; then
            echo "no ebuild changes; nothing to validate"
            echo "BUMP_NO_CHANGES=1" >> "$GITHUB_ENV"
            exit 0
          fi
          bad=0
          for f in $all; do
            bash -n "$f" || { echo "::error::syntax check failed: $f"; bad=1; }
            case "$f" in
              *opencode-bin*|*zcode-bin*|*codex-bin*|*claude-code-bin*|*maa-cli*)
                d=$(dirname "$f"); pn=$(basename "$d")
                base=$(basename "$f" .ebuild)
                pw=${base#"$pn-"}; pv=${pw%_p1}
                up=$(grep -m1 '^UPSTREAM_PV="' "$f" | cut -d'"' -f2)
                case "$up" in
                  *'${PV'*|"") up="${pv%%_*}" ;;
                esac
                # expand the distfile template the way the ebuild would
                distfile=$(sed -n 's/.*-> \([^)" ]*\).*/\1/p' "$f" | head -n 1)
                distfile=$(printf '%s' "$distfile" \
                  | sed -e "s/\${UPSTREAM_PV}/$up/g" \
                        -e "s/\${PN}/$pn/g" \
                        -e "s/\${P}/$pn-$pv/g" \
                        -e "s/\${PV}/$pv/g")
                if [ -z "$distfile" ] || ! grep -q "^DIST $distfile " "$d/Manifest"; then
                  echo "::error::$f: distfile '$distfile' missing from Manifest (pkgdev manifest step needed)"; bad=1
                fi
                ;;
            esac
          done
          [ "$bad" -eq 0 ] || exit 1
          echo "sanity checks passed for:"$'\n'"$all"
          # stash the change report for the post-run insights step
          git diff --cached --name-status --diff-filter=AM > .bump-file-changes.txt
          git diff --cached --stat --diff-filter=AM > .bump-diffstat.txt

      - name: Rebase onto remote master
        if: steps.needed.outputs.up_to_date != 'true'
        run: |
          set -euo pipefail
          if ! git pull --rebase origin master; then
            git rebase --abort 2>/dev/null || true
            git stash
            if ! git pull --rebase origin master; then
              echo "::error::rebase against remote master failed (concurrent history change); resolve manually"
              exit 1
            fi
            git stash pop
          fi

      - name: Commit & push changes
        if: steps.needed.outputs.up_to_date != 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Auto bump ${{ steps.date.outputs.date }}
          commit_user_name: lax-bot
          commit_user_email: lax@users.noreply.github.com
          commit_author: lax-bot <lax@users.noreply.github.com>

      - name: Post-run insights
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_VER: ${{ steps.ver.outputs.version }}
          UP_TO_DATE: ${{ steps.needed.outputs.up_to_date }}
        run: bash .github/scripts/post-bump-insights.sh
